version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # The contract is a single small file kept at proto/echo.proto rather than
    # proto/echo/v1/; message names follow the Echo{Request,Response} style used
    # throughout the assignment code.
    - PACKAGE_DIRECTORY_MATCH
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
