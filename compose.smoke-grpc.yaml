# Scenario: 1.3 streaming gRPC server in its own container, a client checks it over the network.
#   docker compose -f compose.smoke-grpc.yaml up --build --abort-on-container-exit --exit-code-from client
#   docker compose -f compose.smoke-grpc.yaml down

name: lab1-smoke-grpc

services:
  server:
    build: .
    image: lab1-echo
    command: server-grpc -addr :9103
    ports: ["9103:9103"]

  client:
    build: .
    image: lab1-echo
    command: client-grpc -addr server:9103 -messages 100 -streams 10
    depends_on: [server]
